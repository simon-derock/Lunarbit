[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lunarbit"
version = "0.1.0"
description = "Evidence-verifiable personal-commerce reconstruction and GraphRAG"
requires-python = ">=3.12"
dependencies = [
  "pillow>=12,<13",
  "pydantic>=2.12,<3",
  "pymupdf>=1.26,<2",
]

[project.optional-dependencies]
agent = [
  "huggingface-hub>=0.35,<2",
  "langgraph>=0.6,<2",
  "langgraph-checkpoint-sqlite>=2.0,<3",
  "python-dotenv>=1.1,<2",
  "tokenizers>=0.22,<1",
]
extract = [
  "pdfplumber>=0.11,<1",
]
graph = [
  "neo4j>=5.26,<6",
]
dev = [
  "httpx>=0.27,<0.28",
  "hypothesis>=6.138,<7",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-timeout>=2.4,<3",
  "ruff>=0.12,<1",
]
api = [
  "anyio>=4.10,<5",
  "fastapi>=0.116,<1",
  # Starlette 0.47+ currently deadlocks TestClient on Python 3.12.
  "starlette>=0.46,<0.47",
  "python-dotenv>=1.1,<2",
  "uvicorn>=0.35,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lunarbit"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
