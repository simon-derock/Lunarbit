[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lunarbit"
version = "0.1.0"
description = "Evidence-verifiable personal-commerce reconstruction and GraphRAG"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
extract = [
  "pdfplumber>=0.11,<1",
  "pymupdf>=1.26,<2",
]
dev = [
  "hypothesis>=6.138,<7",
  "mypy>=1.17,<2",
  "pytest>=9,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lunarbit"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
