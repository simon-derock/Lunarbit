name: Lunarbit CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lunarbit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.22"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev --extra api --extra graph --extra agent
      - run: uv lock --check
      - run: uv run ruff format --check src scripts tests
      - run: uv run ruff check src scripts tests
      - run: uv run mypy --strict --no-incremental src
      - name: Run Python contracts without third-party pytest autoload hooks
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: uv run pytest -vv -x --tb=long
      - run: uv run python scripts/verify_repository_hygiene.py

  frontend:
    name: Lunarbit frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - name: Assert private credentials are absent from frontend artifacts
        run: |
          if rg -n "LUNARBIT_PRIVATE_API_TOKEN|COHERE_API_KEY|GEMINI_API_KEY|MISTRAL_API_KEY" dist --glob '!*.map'; then
            echo "private credential marker found in frontend build" >&2
            exit 1
          fi

  public-container:
    name: Public container boundary
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.22"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra api --extra graph
      - run: docker build --file Dockerfile.public --tag lunarbit-public-api:ci .
      - run: docker run --detach --rm --name lunarbit-public-api --publish 127.0.0.1:8012:8000 lunarbit-public-api:ci
      - name: Audit the browser-facing boundary
        run: |
          for attempt in {1..20}; do
            if uv run python scripts/verify_public_release.py --api-url http://127.0.0.1:8012 --origin http://127.0.0.1:5173; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - if: always()
        run: docker stop lunarbit-public-api || true

  api-container:
    name: Production API container
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: lunarbit-api:ci
      - name: Run production API smoke checks
        run: |
          docker run --detach --rm --name lunarbit-api --publish 127.0.0.1:8014:8000 lunarbit-api:ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8014/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8014/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs lunarbit-api
          exit 1
      - if: always()
        run: docker stop lunarbit-api || true
